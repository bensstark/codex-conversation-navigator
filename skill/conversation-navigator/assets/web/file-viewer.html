<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Code Viewer</title>
    <link rel="stylesheet" href="/file-viewer.css">
  </head>
  <body class="topbar-hidden" data-code-theme="dark">
    <header class="file-toolbar">
      <a class="back-link" href="/">Conversation Navigator</a>
      <div class="file-heading">
        <h1 id="file-name">Code Viewer</h1>
        <p id="file-meta">Loading…</p>
        <p id="file-path" class="file-path" title=""></p>
      </div>
      <div class="file-actions">
        <button id="theme-toggle" class="toolbar-button" type="button" aria-label="Switch to light theme" title="Switch to light theme">Light</button>
        <button id="view-toggle" class="toolbar-button" type="button" aria-label="Show Markdown source" title="Show Markdown source" hidden>Source</button>
        <div class="font-controls" role="group" aria-label="Code font size">
          <button id="font-decrease" class="font-control" type="button" aria-label="Decrease code font size" title="Decrease code font size">A−</button>
          <span id="font-size" class="font-size-value" aria-live="polite">16px</span>
          <button id="font-increase" class="font-control" type="button" aria-label="Increase code font size" title="Increase code font size">A+</button>
        </div>
        <button id="copy-file" type="button" disabled>Copy</button>
      </div>
    </header>

    <main class="file-page">
      <div id="file-status" class="file-status" role="status" aria-live="polite">Loading file…</div>
      <div id="code-scroll" class="code-scroll" hidden>
        <div id="line-numbers" class="code-gutter" aria-hidden="true"></div>
        <pre id="code-content" class="code-content"><code id="source-code"></code><span id="line-focus" class="line-focus" hidden></span></pre>
        <article id="markdown-content" class="markdown-content" hidden></article>
      </div>
    </main>

    <script type="module" src="/file-viewer.js"></script>
  </body>
</html>
