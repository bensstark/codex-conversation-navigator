<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Codex Companion</title>
    <link rel="stylesheet" href="/style.css">
  </head>
  <body data-code-theme="dark">
    <header class="topbar">
      <h1>Codex Companion</h1>
      <p class="shortcut-help"><kbd>Q</kbd> Hide top bar · <kbd>S</kbd> Hide sidebar</p>
      <div class="topbar-controls">
        <label class="source-picker">
          <span>Source</span>
          <select id="source-select" aria-label="Filter conversations by source">
            <option value="all">All</option>
            <option value="vscode">VS Code</option>
            <option value="cli">Codex CLI</option>
          </select>
        </label>
        <label class="thread-picker">
          <span>Thread</span>
          <select id="thread-select" aria-label="Select a Codex conversation"></select>
        </label>
        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch to light theme" title="Switch to light theme">Light</button>
      </div>
    </header>

    <main>
      <aside class="outline-panel" aria-label="User message navigation">
        <label class="search-box">
          <span class="sr-only">Search user messages</span>
          <input id="message-search" type="search" placeholder="Search user messages…" autocomplete="off">
        </label>
        <nav id="message-outline" aria-label="User message list"></nav>
      </aside>

      <section class="conversation-panel" aria-label="Conversation">
        <div id="status" class="status" role="status" aria-live="polite">Connecting to Codex…</div>
        <div id="transcript" class="transcript" tabindex="0"></div>
      </section>
    </main>

    <script type="module" src="/app.js"></script>
  </body>
</html>
